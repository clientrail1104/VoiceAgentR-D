<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevenLabs Multi-Tool Workbench</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: #fff;
        }

        .api-key-section {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* Nav Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        button.action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.action-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .output-box {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 8px;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ElevenLabs Operations Workbench</h1>

    <!-- Global API Settings -->
    <div class="api-key-section">
        <label for="apiKey">ElevenLabs API Key</label>
        <input type="password" id="apiKey" placeholder="Enter your xi-api-key here...">
    </div>

    <!-- Multi Work Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tts')">Text-To-Speech</button>
        <button class="tab-btn" onclick="switchTab('sfx')">Sound Effects</button>
        <button class="tab-btn" onclick="switchTab('stt')">Speech-To-Text</button>
        <button class="tab-btn" onclick="switchTab('agent')">AI Agent Widget</button>
    </div>

    <!-- TAB 1: Text-to-Speech -->
    <div id="tts" class="tab-content active">
        <label for="voiceId">Voice ID</label>
        <input type="text" id="voiceId" value="21m00Tcm4TlvDq8ikWAM" placeholder="e.g., 21m00Tcm4TlvDq8ikWAM (Rachel)">

        <label for="ttsModel">Model</label>
        <select id="ttsModel">
            <option value="eleven_multilingual_v2">Eleven Multilingual v2</option>
            <option value="eleven_flash_v2_5">Eleven Flash v2.5 (Fast / Low Latency)</option>
            <option value="eleven_v3">Eleven v3 (Expressive)</option>
        </select>

        <label for="ttsText">Input Text</label>
        <textarea id="ttsText" rows="4" placeholder="Enter text to generate audio..."></textarea>

        <button class="action-btn" id="ttsBtn" onclick="generateTTS()">Generate Speech</button>
        
        <div class="output-box" id="ttsOutput" style="display:none;">
            <label>Generated Audio Output</label>
            <audio id="ttsAudio" controls></audio>
        </div>
    </div>

    <!-- TAB 2: Sound Effects -->
    <div id="sfx" class="tab-content">
        <label for="sfxPrompt">Sound Effect Prompt</label>
        <textarea id="sfxPrompt" rows="3" placeholder="e.g., Cinematic laser shoot, heavy retro impact..."></textarea>

        <label for="sfxDuration">Duration (Seconds, Optional)</label>
        <input type="text" id="sfxDuration" placeholder="e.g., 2.5">

        <button class="action-btn" id="sfxBtn" onclick="generateSFX()">Generate Sound Effect</button>

        <div class="output-box" id="sfxOutput" style="display:none;">
            <label>Generated Sound Effect</label>
            <audio id="sfxAudio" controls></audio>
        </div>
    </div>

    <!-- TAB 3: Speech to Text (Transcription) -->
    <div id="stt" class="tab-content">
        <label for="sttFile">Upload Audio File (.mp3, .wav)</label>
        <input type="file" id="sttFile" accept="audio/*">

        <button class="action-btn" id="sttBtn" onclick="transcribeAudio()">Transcribe Audio</button>

        <div class="output-box" id="sttOutput" style="display:none;">
            <label>Transcription Result</label>
            <textarea id="sttTextResult" rows="5" readonly></textarea>
        </div>
    </div>

    <!-- TAB 4: Embed ElevenLabs Conversational Voice Agent -->
    <div id="agent" class="tab-content">
        <label for="agentId">ElevenLabs Agent ID</label>
        <input type="text" id="agentId" placeholder="Paste your Agent ID from ElevenLabs Dashboard">

        <button class="action-btn" onclick="loadAgentWidget()">Mount Voice Agent Widget</button>

        <div class="output-box" id="agentContainer" style="display:none;">
            <p class="status">Agent Widget Mounted below or in bottom-right corner.</p>
        </div>
    </div>

    <p id="statusMsg" class="status"></p>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        setStatus('');
    }

    function setStatus(msg) {
        document.getElementById('statusMsg').innerText = msg;
    }

    function getApiKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (!key) {
            alert('Please enter your ElevenLabs API key.');
            return null;
        }
        return key;
    }

    // 1. TEXT TO SPEECH WORKER
    async function generateTTS() {
        const apiKey = getApiKey();
        if (!apiKey) return;

        const voiceId = document.getElementById('voiceId').value.trim();
        const modelId = document.getElementById('ttsModel').value;
        const text = document.getElementById('ttsText').value.trim();

        if (!text) return alert('Please enter text for generation.');

        const btn = document.getElementById('ttsBtn');
        btn.disabled = true;
        setStatus('Generating audio...');

        try {
            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                method: 'POST',
                headers: {
                    'Accept': 'audio/mpeg',
                    'xi-api-key': apiKey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    text: text,
                    model_id: modelId
                })
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            
            const audioElement = document.getElementById('ttsAudio');
            audioElement.src = audioUrl;
            document.getElementById('ttsOutput').style.display = 'block';
            setStatus('TTS generation successful!');
        } catch (err) {
            setStatus(`Error: ${err.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    // 2. SOUND EFFECTS WORKER
    async function generateSFX() {
        const apiKey = getApiKey();
        if (!apiKey) return;

        const prompt = document.getElementById('sfxPrompt').value.trim();
        const duration = document.getElementById('sfxDuration').value.trim();

        if (!prompt) return alert('Please enter a sound effect prompt.');

        const btn = document.getElementById('sfxBtn');
        btn.disabled = true;
        setStatus('Generating sound effect...');

        const payload = { text: prompt };
        if (duration && !isNaN(duration)) {
            payload.duration_seconds = parseFloat(duration);
        }

        try {
            const response = await fetch('https://api.elevenlabs.io/v1/sound-generation', {
                method: 'POST',
                headers: {
                    'Accept': 'audio/mpeg',
                    'xi-api-key': apiKey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            const blob = await response.blob();
            const audioUrl = URL.createObjectURL(blob);
            
            const audioElement = document.getElementById('sfxAudio');
            audioElement.src = audioUrl;
            document.getElementById('sfxOutput').style.display = 'block';
            setStatus('SFX generation successful!');
        } catch (err) {
            setStatus(`Error: ${err.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    // 3. SPEECH TO TEXT WORKER (Scribe)
    async function transcribeAudio() {
        const apiKey = getApiKey();
        if (!apiKey) return;

        const fileInput = document.getElementById('sttFile');
        if (!fileInput.files.length) return alert('Please select an audio file.');

        const btn = document.getElementById('sttBtn');
        btn.disabled = true;
        setStatus('Transcribing audio...');

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('model_id', 'scribe_v1');

        try {
            const response = await fetch('https://api.elevenlabs.io/v1/speech-to-text', {
                method: 'POST',
                headers: {
                    'xi-api-key': apiKey
                },
                body: formData
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            const data = await response.json();
            document.getElementById('sttTextResult').value = data.text || 'No speech detected.';
            document.getElementById('sttOutput').style.display = 'block';
            setStatus('Transcription completed successfully!');
        } catch (err) {
            setStatus(`Error: ${err.message}`);
        } finally {
            btn.disabled = false;
        }
    }

    // 4. CONVERSATIONAL AGENT WIDGET MOUNTER
    function loadAgentWidget() {
        const agentId = document.getElementById('agentId').value.trim();
        if (!agentId) return alert('Please input a valid Agent ID.');

        // Inject the official ElevenLabs Conversational AI Web Component script
        if (!document.getElementById('elevenlabs-agent-script')) {
            const script = document.createElement('script');
            script.id = 'elevenlabs-agent-script';
            script.src = 'https://elevenlabs.io/convai-widget/index.js';
            script.async = true;
            document.body.appendChild(script);
        }

        // Add the custom element tag
        let widget = document.querySelector('elevenlabs-convai');
        if (!widget) {
            widget = document.createElement('elevenlabs-convai');
            document.body.appendChild(widget);
        }
        widget.setAttribute('agent-id', agentId);

        document.getElementById('agentContainer').style.display = 'block';
        setStatus('Voice Agent Widget loaded!');
    }
</script>

</body>
</html>
